<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>階段チャレンジ</title>

    <!-- QR読み取りライブラリ -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- CSS読み込み -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- スタート演出 -->
    <div id="startEffect">スタート！</div>

    <h1>階段チャレンジ！</h1>

    <p id="status">下のボタンから<br>カメラを起動してください</p>

    <button id="startButton">カメラを起動</button>

    <div id="reader"></div>
    <div id="timer"></div>

    <!-- 記録フォーム -->
    <div id="formArea">
        <h2>以下の項目を入力して<br>記録を登録してください</h2>

        <label>名前（ランキング用）</label><br>
        <input id="inputName" type="text"><br>

        <label>階段チャレンジは何回目ですか？</label><br>
        <select id="inputTimes">
            <option value="1回目">1回目</option>
            <option value="2回目">2回目</option>
            <option value="3~5回目">3~5回目</option>
            <option value="それ以上">それ以上</option>
        </select><br>

        <label>普段、階段を利用しますか？</label><br>
        <select id="inputHabit">
            <option value="全く利用しない">全く利用しない</option>
            <option value="あまり利用しない">あまり利用しない</option>
            <option value="たまに利用する">たまに利用する</option>
            <option value="よく利用する">よく利用する</option>
        </select><br>

        <button id="submitRecord">記録を送信</button>
    </div>

    <div id="surveyArea" style="display:none; margin-top:25px;">
        <p style="font-size:1.3em; font-weight:bold;">
            1分で終わるアンケートに<br>ご協力ください！
        </p>

	<div id="rankingArea" style="display:none; margin-top: 30px;">
	 <div>
	    <a id="rankingLink" href="#" target="_blank" class="survey-button">
	        アンケートに進む
   		 </a>
	</div>

		<div style="margin-bottom: 30px;">
        <a id="surveyLink" href="#" target="_blank"
           style="font-size:1.3em; color:#0078ff; text-decoration:underline;">
           現在のランキングはこちら
        </a>
	</div>

</div>


</div>


    <!-- JS読み込み -->
    <script src="script.js?v=2"></script>

</body>
</html>
